<!DOCTYPE html>
<html>
<head>
  
  <title>Smart Event Dashboard</title>
  <link rel="stylesheet" href="Assignment-1.css">
</head>
<body>
  <!--for web title-->
<h1 class="title">🎯 Smart Event Dashboard</h1>
<!-- for event form -->
 <div class="div">
<div class="event-form">
  <form id="eventForm">
    <h1>Add New Event</h1>
    <p>Event Title:</p>
    <input type="text" id="eventTitle" placeholder="Event Title">
    <p>Event Date:</p>
    <input type="date" name="eventDate" id="eventDate">
    <p>Category:</p>
    <select name="category" id="category">
      <option value="conference">Conference</option>
      <option value="social">Social</option>
      <option value="workshop">Workshop</option>
    </select>
    <!-- for event description-->
    <p>Description:</p>
    <textarea id="eventDescription" placeholder="Event Description"></textarea>
    <button type="submit">Add Event</button>
  </form>
</div>
<!-- for event list -->
<div class="Events">
  <h1>My Events</h1>
  <button id="clearEvents">Clear Events</button>
  <button id="addSampleEvents">Add Sample Events</button>
</div>
</div>
<div class="demo">
  <!-- for dom manipulation-->
  <h1>DOM Manipulation Demo</h1>

</div>

  <script src="Assignment-1.js"></script>
</body>
</html>
